# GENESIS v6.0 - Tier 8
# Generative Engine for Novel Exploitation & Security Intelligence Study
# Source-aware reasoning · Adversarial hypothesis synthesis · Self-extending tooling · Long-horizon planning

# ── Shared environment blocks (YAML anchors) ──────────────────────────────────
x-backend-env: &backend-env
  REDIS_URL: redis://redis:6379
  CHROMA_HOST: chromadb
  CHROMA_PORT: 8000
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-genesis}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
  MINIO_BUCKET: ${MINIO_BUCKET:-genesis-artifacts}
  MINIO_SECURE: "false"
  ARTIFACT_ROOT: /data/security/artifacts
  MCP_API_KEY: ${MCP_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  WORKER_CAPABILITIES: ${WORKER_CAPABILITIES:-}
  # v5.0 Tier 7 — source-aware reasoning & adversarial synthesis settings
  MAX_REASONING_DEPTH: "5"
  HYPOTHESIS_MARKET_THRESHOLD: "0.3"
  SURFACE_WATCH_INTERVAL: "3600"
  CVE_EXTRAPOLATOR_ENABLED: "true"

x-forge-sandbox: &forge-sandbox
  build: ./sandbox
  networks:
    - default
    - vuln-lab
  read_only: true
  tmpfs:
    - /tmp/work:size=100m,mode=1777
  mem_limit: 256m
  pids_limit: 128
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  environment:
    PORT: 3201
  healthcheck:
    test: ["CMD", "python3", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:3201/health', timeout=3); sys.exit(0)"]
    interval: 20s
    timeout: 5s
    retries: 3

version: '3.8'

services:

  # ── Data stores ─────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: security_research
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d security_research"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:?Set MONGODB_PASSWORD in .env}
      MONGO_INITDB_DATABASE: security_research
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # v5.0 — ChromaDB expanded in-place with 5 new collections (no migration needed;
  # get_or_create_collection() initialises them on first access):
  #   source_corpus · invariants · hypotheses · provenance · synthesized_tools
  # Existing 4 collections (vulnerabilities, attack_patterns, attack_techniques,
  # session_reflections) on the chroma_data volume are untouched.
  chromadb:
    image: chromadb/chroma:0.5.18
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # T23 — MinIO shared artifact store (single-node). Backend + every worker uses
  # the same endpoint. T80 repo_ingest also writes source archives here.
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-genesis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 15s

  # T21 — Attack knowledge graph. Cross-session typed graph of hosts, services,
  # credentials, and findings. T104 surface_diff also queries historical surface here.
  neo4j:
    image: neo4j:5.24-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_db_tx__log_rotation_retention__policy: "2 days 1G"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Application tier ─────────────────────────────────────────────────────────

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - default
      - vuln-lab
    volumes:
      - security_data:/data/security
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Celery async task worker — runs research sub-tasks dispatched by the backend.
  celery_worker:
    build: ./backend
    command: celery -A app.services.celery_app worker --loglevel=info -c 4 -Q research
    env_file: .env
    environment:
      <<: *backend-env
    depends_on:
      - backend
      - redis
    volumes:
      - security_data:/data/security
      # v7.x — required by _cleanup_session_containers so the orchestrator
      # can `docker rm -f` orphan compose containers at session finalize.
      - /var/run/docker.sock:/var/run/docker.sock

  # v6.0 T122 — Replica Manager: spawn OSS clones of targets for safe exploit testing
  replica_manager:
    build: ./replica-manager
    ports:
      - "3701:3701"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      MINIO_ENDPOINT: minio:9000
      REPLICA_MANAGER_URL: http://replica_manager:3701
      REPLICA_NETWORK: genesis_replica_net
      REPLICA_BASE_PORT: "4000"
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3701/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # v5.0 Tier 7 — Celery beat scheduler for daemon tasks:
  #   T90 cross_session_miner  (every 6 h)
  #   T91 cve_extrapolator     (daily 03:00 UTC)
  #   T98 surface_watcher      (hourly)
  #   T101 graph_compactor     (every 12 h)
  celery_beat:
    build: ./backend
    command: celery -A app.services.celery_app beat --loglevel=info
    env_file: .env
    environment:
      <<: *backend-env
    depends_on:
      - redis
      - backend
    volumes:
      - security_data:/data/security

  mcp_server:
    build: ./mcp-server
    ports:
      - "3001:3001"
    networks:
      - default
      - vuln-lab
    volumes:
      - security_data:/data/security
    environment:
      PORT: 3001
      NODE_ENV: production
      MCP_API_KEY: ${MCP_API_KEY:-}
      BACKEND_URL: http://backend:8000
      ARTIFACT_ROOT: /data/security/artifacts
      FORGE_SANDBOX_URL: http://forge_sandbox:3201
      # T28 — comma-separated pool for round-robin dispatch.
      FORGE_SANDBOX_URLS: http://forge_sandbox:3201,http://forge_sandbox_2:3201,http://forge_sandbox_3:3201,http://forge_sandbox_4:3201
      GHIDRA_URL: http://ghidra_headless:3101
      CHROMIUM_RENDERER_URL: http://chromium_renderer:3301
      FUZZER_URL: http://fuzzer:3401
      SYMBEX_URL: http://symbex:3501
      INSTRUMENTATION_URL: http://instrumentation:3601
      REPLICA_MANAGER_URL: http://replica_manager:3701
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    depends_on:
      - forge_sandbox
      - forge_sandbox_2
      - forge_sandbox_3
      - forge_sandbox_4
      - ghidra_headless
      - chromium_renderer
      - fuzzer
      - symbex
      - instrumentation

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ── Tier-2 AI-driven discovery: forge_sandbox pool ───────────────────────────
  # T28 — four replicas so payload_swarm can fan variants out in parallel without
  # back-pressure on a single worker. MCP forge_runner round-robins across them.

  forge_sandbox:
    <<: *forge-sandbox

  forge_sandbox_2:
    <<: *forge-sandbox

  forge_sandbox_3:
    <<: *forge-sandbox

  forge_sandbox_4:
    <<: *forge-sandbox

  # ── Tier-2/3 specialist services ─────────────────────────────────────────────

  ghidra_headless:
    build: ./ghidra
    volumes:
      - security_data:/data/security:ro
      - ghidra_work:/work
    networks:
      - default
    mem_limit: 2560m
    environment:
      PORT: 3101
      GHIDRA_TIMEOUT_S: 600
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:3101/health', timeout=3); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3

  chromium_renderer:
    build: ./renderer
    networks:
      - default
      - vuln-lab
    mem_limit: 768m
    shm_size: 1g
    environment:
      PORT: 3301
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3301/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # T9 — coverage-guided fuzzer (AFL++ / honggfuzz).
  fuzzer:
    build: ./fuzzer
    networks:
      - default
    volumes:
      - security_data:/data/security:ro
    mem_limit: 1024m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: 3401
      ARTIFACT_ROOT: /data/security/artifacts
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3401/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # T10 — angr symbolic execution / constraint solver.
  symbex:
    build: ./symbex
    networks:
      - default
    volumes:
      - security_data:/data/security:ro
    mem_limit: 2048m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    environment:
      PORT: 3501
      ARTIFACT_ROOT: /data/security/artifacts
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3501/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # T25 — dynamic instrumentation adapter (Frida + DynamoRIO).
  # SYS_PTRACE is required for Frida injection; all other caps dropped.
  # seccomp=unconfined because Frida gum-stalker trips the default filter.
  # No vuln-lab egress — the instrumented binary runs inside this container.
  instrumentation:
    build: ./instrumentation
    networks:
      - default
    volumes:
      - security_data:/data/security:ro
    mem_limit: 2048m
    pids_limit: 256
    cap_drop:
      - ALL
    cap_add:
      - SYS_PTRACE
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
    environment:
      PORT: 3601
      ARTIFACT_ROOT: /data/security/artifacts
      INSTWORK: /tmp/instwork
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3601/health"]
      interval: 30s
      timeout: 5s
      retries: 3

# ── Named volumes ────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  chroma_data:       # ChromaDB: 4 v1–v4 collections + 5 new v5 collections
  security_data:
  ghidra_work:
  neo4j_data:
  neo4j_logs:
  minio_data:

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  default: {}
  vuln-lab:
    external: true
    name: genesis_vuln-lab
  # v6.0 T122 — isolated network for replica containers spawned by replica_manager
  genesis_replica_net:
    name: genesis_replica_net
    driver: bridge
